<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>PulseCanvas Studio — On all your devices</title>
<style>
*{box-sizing:border-box}html,body{margin:0}body{font-family:"Avenir Next",Avenir,-apple-system,sans-serif;color:#201729;background:#f8f5fb}
.canvas{position:relative;width:var(--w);height:var(--h);overflow:hidden;background:linear-gradient(160deg,#fdfcfe,#f5effa)}
.halo{position:absolute;width:75%;height:65%;right:-20%;bottom:-20%;border-radius:50%;background:#c3a2eb;opacity:.25;filter:blur(120px)}
.copy{position:absolute;inset:var(--pad) var(--pad) auto}.brand{display:flex;align-items:center;gap:20px;font-size:var(--brand);font-weight:600;color:#4a4257}
.brand img{height:var(--icon);width:var(--icon);border-radius:22%}h1{margin:32px 0 0;font-size:var(--title);line-height:1.06;letter-spacing:-.035em;font-weight:700}em{font-style:normal;color:#7f3fe0}.sub{font-size:var(--sub);line-height:1.3;color:#54485f;margin:28px 0 0;font-weight:500}
.devices{position:absolute;left:var(--pad);right:var(--pad);top:var(--top);bottom:var(--pad);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:var(--gap)}
.tile{min-height:0;min-width:0;display:flex;flex-direction:column;padding:var(--tilepad);background:#fff;border:2px solid #eee7f5;border-radius:var(--radius);box-shadow:0 22px 65px #35224512}
.name{font-size:var(--label);font-weight:650;letter-spacing:-.02em;margin:0 0 20px}.art{display:flex;align-items:center;justify-content:center;flex:1;min-height:0;min-width:0;padding-bottom:8px}
.screen{max-width:100%;max-height:100%;display:block;object-fit:contain;border:8px solid #25212b;border-radius:24px;box-shadow:0 14px 24px #241a3024;background:#1e1924}
.phone .screen{border-width:9px;border-radius:34px}.vision .screen{border-color:#77717b;border-radius:30px}.mac .screen{border-color:#353039;border-radius:12px}
</style></head><body><main class="canvas"><div class="halo"></div><header class="copy"><div class="brand"><img id="icon" alt="">PulseCanvas Studio</div><h1>On all your <em>devices.</em></h1><p class="sub">iPhone · iPad · Mac · Vision Pro</p></header><section class="devices" aria-label="PulseCanvas Studio on four devices"></section></main>
<script>
const q=new URLSearchParams(location.search),kind=q.get('kind')||'iphone',root=q.get('sources').replace(/\/$/,'');
const presets={iphone:[1320,2868,90,54,84,144,62,710,46,30,48,48],ipad:[2752,2064,120,60,92,164,72,570,48,32,48,58],duo:[2853,2007,120,60,92,164,72,570,48,32,48,58],mac:[2880,1800,110,56,86,150,66,700,42,28,42,54],vision:[3840,2160,140,76,112,200,84,840,58,36,54,70]};
const keys=['w','h','pad','brand','icon','title','sub','top','gap','tilepad','radius','label'];presets[kind].forEach((v,i)=>document.documentElement.style.setProperty('--'+keys[i],v+'px'));
document.getElementById('icon').src=q.get('icon');
if(kind==='duo')document.querySelector('.sub').textContent='iPhone Duo · iPad · Mac · Vision Pro';
for(const [name,file,cls] of [kind==='duo'?['iPhone Duo','duo-closed-studio.png','phone duo-closed']:['iPhone','iphone-studio.png','phone'],['iPad','ipad-studio.png','tablet'],['Mac','mac-studio.png','mac'],['Vision Pro','vision-studio.png','vision']]){
 const tile=document.createElement('article');tile.className='tile '+cls;tile.innerHTML=`<p class="name">${name}</p><div class="art"><img class="screen" src="${root}/${file}" alt="PulseCanvas Studio on ${name}"></div>`;document.querySelector('.devices').append(tile);
}
</script></body></html>
